appId: com.ntr.resolver
productName: Aria Player
copyright: Copyright © 2026 Aria
directories:
  buildResources: resources
  output: dist/release

# 应用代码（electron-vite 构建产物，位于 dist/out）
files:
  - dist/out/**
  - package.json

# 内置 api-enhanced 完整服务（不进 asar，子进程直接运行，需写 cookie 数据文件）
extraResources:
  - from: server
    to: ncm-server
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.md'
  # 私有通道子进程入口（Named Pipe / Unix Socket，见 src/main/ncm/bridge.cjs）
  - from: src/main/ncm/bridge.cjs
    to: bridge.cjs
  # ffmpeg 二进制（scripts/fetch-ffmpeg.mjs 下载；未下载时打包需先 npm run fetch:ffmpeg）
  - from: resources/ffmpeg
    to: ffmpeg

asar: true

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: 咏叹调
  uninstallDisplayName: 咏叹调 (Aria Player)

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]

dmg:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: false
# 打包后钩子：补全 resources/ncm-server 的 node_modules（electron-builder 的
# extraResources 不复制 from 目录的依赖，缺失会导致内置服务起不来）
afterPack: scripts/after-pack.cjs
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

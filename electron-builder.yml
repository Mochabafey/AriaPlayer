appId: com.ntr.resolver
productName: Aria Player
copyright: Copyright © 2026 Aria
directories:
  buildResources: resources
  output: dist/release

# 应用代码（electron-vite 构建产物，位于 dist/out）
files:
  - dist/out/**
  - package.json

# 内置 api-enhanced 完整服务（不进 asar，子进程直接运行，需写 cookie 数据文件）
extraResources:
  - from: server
    to: ncm-server
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.md'
  # QQ音乐 API 服务（Rain120/qq-music-api，TS 源码 + node_modules 由 afterPack 补全）
  - from: qqmusic
    to: qqmusic
    filter:
      - '**/*'
      - '!.git/**'
      - '!**/*.map'
  # 私有通道子进程入口（Named Pipe / Unix Socket，见 src/main/ncm/bridge.cjs）
  - from: src/main/ncm/bridge.cjs
    to: bridge.cjs
  # QQ音乐 bridge（子进程入口，劫持 listen → 私有管道）
  - from: src/main/qqmusic/bridge.cjs
    to: bridge-qqmusic.cjs
  # ffmpeg 二进制（scripts/fetch-ffmpeg.mjs 下载；未下载时打包需先 npm run fetch:ffmpeg）
  - from: resources/ffmpeg
    to: ffmpeg
  # 应用图标：**托盘图标运行时需要**（src/main/tray.js 从 process.resourcesPath 读它）。
  # buildResources 里的 icon.png 只用于生成 exe 图标，**不会**进 resources/ ——
  # 缺了它托盘会拿到空 nativeImage，表现为「窗口藏进托盘后找不到入口」
  #（用户以为程序没启动）。
  - from: resources/icon.png
    to: icon.png

asar: true

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: 咏叹调
  uninstallDisplayName: 咏叹调 (Aria Player)

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]

dmg:
  artifactName: ${productName}-${version}.${ext}

# Linux：AppImage（免安装，双击即用）+ deb（Debian/Ubuntu 包管理）
#
# 注意两个坑（都已踩过）：
#   1. deb 打包要求 package.json 的 author 含 email（用作 maintainer），
#      否则报 "Please specify author 'email'"。
#   2. **不要写 desktopName** —— electron-builder 26.x 的 schema 不接受该字段，
#      报 "configuration.linux should be one of these: null"。
#      因为配置校验在打包前统一执行，这一个字段会让**三个平台一起失败**。
#      （窗口关联的 app_id/WM_CLASS 由 electron-builder 按 productName 自动推导）
linux:
  icon: resources/icon.png
  category: Audio
  synopsis: 网易云 / QQ 音乐 / B站 三音源播放器
  description: 咏叹调（Aria Player）—— 三音源（网易云 + QQ 音乐 + B站）解析 / 播放 / 下载桌面客户端，内置完整 API 服务与 ffmpeg，支持弹幕、歌词自动对轨、HLS 实时合流。
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  artifactName: ${productName}-${version}.${ext}

deb:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: false
# 打包后钩子：补全 resources/ncm-server 的 node_modules（electron-builder 的
# extraResources 不复制 from 目录的依赖，缺失会导致内置服务起不来）
afterPack: scripts/after-pack.cjs
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

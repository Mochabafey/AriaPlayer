name: Build

# 触发方式（覆盖命令行与网页两种操作习惯）：
#
#   push 到 master/main   → 只验证编译（约 1-2 分钟），不打包
#   push tag v*           → 完整打包三平台 + 创建 Release
#   release: published    → 同上（**网页 Release 页面创建 tag/release 走这条**）
#   create（仅 tag）      → 同上（**网页单独建 tag、不建 Release 走这条**）
#   workflow_dispatch     → 手动触发（Actions 页面 Run workflow）
#
# 为什么要额外监听 release / create：
#   GitHub 网页界面创建 tag 时**不会触发 push 事件**（官方行为）。
#   只监听 push.tags 的话，在网页上打 tag 会「什么都没发生」。
#
#   三个入口的分工：
#     - 命令行 git push origin v0.4.0        → push 事件
#     - 网页 Releases 页「Draft a new release」→ release 事件（会自动建 tag）
#     - 网页 Tags 页单独建 tag                → create 事件
on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 网页创建 Release（或先建 tag 再建 release）时触发
  release:
    types: [published, created]
  # 网页单独创建 tag（不建 Release）时触发。
  # 注意：create 事件对「新建分支」同样会触发，故 job 内用
  # github.ref_type == 'tag' 过滤，避免建分支时白跑 CI。
  create:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台（逗号分隔：win,mac,linux；留空=全部）'
        required: false
        default: ''

# 同一 ref 的重复触发只保留最新一次，避免浪费 CI 配额。
#
# ⚠️ group 必须带上 `github.event_name`（实测踩过）：
#   创建 tag 会**同时触发 push 与 create 两个事件**（API 与网页均如此，
#   已用 `git/refs` API 实测确认）。若 group 只含 ref，两个 run 会落到
#   同一组，`cancel-in-progress` 让后者取消前者 —— 每次打 tag 都白跑一个
#   完整构建（3 job × 6 min ≈ 18 分钟配额），顺序反过来时还可能取消掉
#   本该成功的那次。
#
#   带上 event_name 后，push / create / release / workflow_dispatch 各自
#   独立成组，互不干扰；同一事件的真·重复触发（如连推两次）仍会被合并。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 构建矩阵：三个平台并行
  #
  # 为什么每个平台都要独立跑 vendor + fetch:ffmpeg：
  #   1. api-enhanced / qq-music-api 是**运行时依赖**，必须打进包里
  #   2. ffmpeg 二进制是**平台相关**的（win64 / macos64 / linux64），
  #      不能跨平台复用
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 「是否需要打包」的统一判断，供下面各 step 复用。
    #
    # 四个条件对应四种发布入口：
    #   1. 命令行推 tag        → push 事件，ref 形如 refs/tags/v0.3.0
    #   2. 网页创建 Release    → release 事件（ref 同样是 refs/tags/...）
    #   3. 网页单独建 tag      → create 事件（需 github.ref_type == 'tag' 过滤，
    #                            因为建分支也会触发 create）
    #   4. Actions 页面手动触发 → workflow_dispatch
    #
    # 普通 push / PR 不满足任一条件 → 只编译不打包（省 CI 额度）
    env:
      SHOULD_PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'create' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: --win
            artifact: |
              dist/release/*.exe
              dist/release/*.exe.blockmap
            artifact_name: aria-player-windows
          - os: macos-latest
            label: macOS (x64 + arm64)
            target: --mac
            artifact: dist/release/*.dmg
            artifact_name: aria-player-macos
          - os: ubuntu-latest
            label: Linux x64
            target: --linux
            artifact: |
              dist/release/*.AppImage
              dist/release/*.deb
            artifact_name: aria-player-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 部分依赖路径较长（qqmusic/node_modules），Windows 需开启长路径
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 验证关键构建依赖可用。
      #
      # 为什么单独验证：npm 11.x 引入了 allow-scripts 机制，install 脚本
      # 默认可能被跳过（日志里会出现 "packages have install scripts not yet
      # covered by allowScripts"）。esbuild 的二进制虽由 optionalDependencies
      # 的平台包提供、不依赖 postinstall，但若被跳过就会在 electron-vite
      # 构建阶段才报错 —— 那时已经浪费了几分钟 CI。这里提前失败，定位更快。
      - name: Verify build toolchain
        shell: bash
        run: |
          node -e "const {build}=require('esbuild');console.log('esbuild OK')" \
            || node -e "require('esbuild').transformSync('const a=1',{loader:'js'});console.log('esbuild OK')"
          node -e "console.log('electron:', require('electron/package.json').version)"
          node -e "console.log('electron-vite:', require('electron-vite/package.json').version)"

      # 应用图标（从 SVG 生成各尺寸 PNG）
      - name: Generate icon
        run: python scripts/gen-icon.py

      # ---- 运行时依赖：两个内置 API 服务 ----
      #
      # 注意两者的仓库状态不同：
      #   server/   —— 已入库（含 node_modules），脚本检测到 app.js 存在会**自动跳过**
      #                （除非加 --force）。这里仍跑一次是为了：
      #                1) 应用本地补丁（关闭 npm info 版本检查、惰性加载 jsdom 等
      #                   启动优化），补丁逻辑在脚本内，跳过 vendor 就不会执行
      #                2) 万一仓库里的是残缺状态，脚本能自愈
      #   qqmusic/  —— 被 .gitignore 排除（22000+ 文件不适合入库），
      #                CI 必须现场克隆 + npm install
      - name: Vendor api-enhanced (网易云)
        run: node scripts/vendor-server.mjs

      - name: Vendor qq-music-api (QQ 音乐)
        run: node scripts/vendor-qqmusic.mjs

      # ---- ffmpeg（B 站 DASH 合流 / 转码兜底必需）----
      # 脚本按 process.platform 自动选对应平台的静态构建
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs

      # ---- 编译三进程 ----
      # 用 build-app.mjs 而非 electron-vite CLI：
      # 前者会清掉 ELECTRON_RUN_AS_NODE / NODE_OPTIONS，
      # 避免 CI 环境变量污染导致构建产物异常
      - name: Build (main / preload / renderer)
        run: node scripts/build-app.mjs

      # ---- 打包 ----
      #
      # 只在「需要产物」时执行（见 job 级 SHOULD_PACKAGE），普通 push 仅验证编译。
      #
      # 为什么这样分：完整打包三平台约 18 分钟 runner 时间（3 job × 6 min），
      # 而私有仓库免费额度是 2000 分钟/月 —— 若每次 push 都打包，
      # 约 110 次推送就烧完。日常改动只需知道「代码能否编译」。
      - name: Package
        if: env.SHOULD_PACKAGE == 'true'
        env:
          # electron-builder 在 CI 上从 GitHub 拉 electron 与工具链
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifact
        if: env.SHOULD_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------
  # 发布：把三平台产物挂到 Release
  #
  # 只在**不会重复**的入口执行（关键：避免并发写同一个 Release）：
  #
  #   1. push tag（命令行 `git push origin v0.4.0`）→ 创建 Release 并上传
  #   2. release 事件（网页 Releases 页建 Release）→ Release 已存在，追加资产
  #
  # **刻意排除 create 事件**：创建 tag 会同时触发 push + create 两个事件
  #（已用 git/refs API 实测确认）。若两者都跑本 job，就会有两个 run 并发
  # 写同一个 Release —— softprops/action-gh-release 在这种并发下存在竞态
  #（见 upstream issue #705），可能出现「Release 建了但资产只传了一半」
  # 或报错。所以只让 push 事件负责建 Release；create 事件仍会构建并上传
  # artifact（供 Actions 页面下载），只是不发 Release。
  #
  # 注：命令行推 tag 与网页建 tag 两种操作都会触发 push 事件，
  # 所以「只靠 push 发 Release」能覆盖全部正常发布路径。
  # ---------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 校验 tag 与 package.json 版本一致，避免产物文件名与 tag 对不上
      #（实测踩过：v0.2.1 的 tag 上构建出 0.2.4 的产物）
      #
      # 各入口下 github.ref 都是 refs/tags/vX.Y.Z，故逻辑通用。
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json version ($PKG) 不一致，产物文件名会对不上"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aria Player ${{ github.ref_name }}
          # draft: false → 直接发布（本仓库为私有仓库，仅协作者可见）
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows | `Aria Player-*-setup.exe` | 安装版（可选目录、创建快捷方式「咏叹调」） |
            | Windows | `Aria Player-*-portable.exe` | 免安装版，双击即用 |
            | macOS | `Aria Player-*.dmg` | 同时含 Intel(x64) 与 Apple Silicon(arm64) |
            | Linux | `*.AppImage` | 免安装，`chmod +x` 后双击运行 |
            | Linux | `*.deb` | Debian/Ubuntu 包管理安装 |

            ## 首次运行提示

            三个平台均**未签名**，系统可能拦截：

            - **Windows**：SmartScreen 警告 → 「更多信息」→「仍要运行」
            - **macOS**：右键 → 打开；或终端执行
              `xattr -dr com.apple.quarantine "/Applications/Aria Player.app"`
            - **Linux**：`chmod +x "Aria Player-*.AppImage"`

            ## 说明

            应用**内置**完整运行时依赖，无需自行安装任何东西：

            - 网易云 API 服务（api-enhanced）
            - QQ 音乐 API 服务（qq-music-api）
            - ffmpeg（B 站 DASH 合流 / 转码兜底）

            三个服务均通过 **Named Pipe / Unix Socket** 与主进程通信，
            不占用任何 TCP 端口。

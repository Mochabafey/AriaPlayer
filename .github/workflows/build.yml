name: Build

# 触发方式
#
#   push 到 master/main   → 只验证编译（约 1-2 分钟），**不打包、不上传 artifact**
#   push tag v*           → 完整打包三平台 + 创建 Release
#   release: published    → 同上（网页 Release 页面创建时走这条）
#   workflow_dispatch     → 手动触发
#
# ## ⚠️ 为什么不再监听 `create`（实测踩过大坑）
#
# 早期为了「网页单独打 tag 也能触发」加了 `create` 事件。但实测发现：
# 创建 tag 会**同时触发 push 与 create 两个事件**，而 `concurrency` 的
# group 带了 event_name（为了让两者不互相取消），于是**两个 run 都跑完整构建**。
#
# 叠加「推 master」那一次，**每次发版 = 3 次完整三平台构建**：
#
#     git push origin master    → push(master)   → 构建 ①
#     git push origin v0.3.7    → push(v0.3.7)   → 构建 ②
#                               → create(v0.3.7) → 构建 ③
#
# 每次产出 3 个平台包（约 1 GB），3 次就是 3 GB。实测累计 17.5 GB / 51 个
# artifact，直接把 Actions 存储配额吃满。
#
# 现在改为**只监听 push**：
#   - 命令行推 tag        → push 事件（覆盖）
#   - 网页建 tag          → 实测**同样会触发 push 事件**（用 git/refs API 验证过）
#   - 网页建 Release      → release 事件（保留，因为这条确实不触发 push）
#
# 即 push 已经覆盖了「网页建 tag」这个场景，create 是冗余的。
on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 网页创建 Release（Draft a new release）时触发。
  # 这条**不会**触发 push 事件，故必须保留。
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台（逗号分隔：win,mac,linux；留空=全部）'
        required: false
        default: ''

# 同一 ref 的重复触发只保留最新一次。
#
# group 带 event_name 的理由（保留自早期修复）：push 与 release 可能
# 因同一次操作先后触发，不带 event_name 会让后到的取消先到的 ——
# 而先到的可能才是带产物的那次。带上后各自独立成组。
#
# 注：`create` 事件已移除，所以现在同一次发版最多 2 个 run
#（push + release，且只有网页建 Release 时才会同时出现）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 构建矩阵：三个平台并行
  #
  # 为什么每个平台都要独立跑 vendor + fetch:ffmpeg：
  #   1. api-enhanced / qq-music-api 是**运行时依赖**，必须打进包里
  #   2. ffmpeg 二进制是**平台相关**的（win64 / macos64 / linux64），
  #      不能跨平台复用
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 「是否需要打包」的统一判断，供下面各 step 复用。
    #
    # 三个条件对应三种发布入口：
    #   1. tag 推送/网页建 tag → ref 形如 refs/tags/v0.3.0
    #      （两种操作都会触发 push 事件，已实测）
    #   2. 网页创建 Release    → release 事件（ref 同样是 refs/tags/...）
    #   3. Actions 页面手动触发 → workflow_dispatch
    #
    # 普通 push / PR 不满足任一条件 → 只编译不打包（省 CI 额度与存储）
    env:
      SHOULD_PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: --win
            artifact: |
              dist/release/*.exe
              dist/release/*.exe.blockmap
            artifact_name: aria-player-windows
          - os: macos-latest
            label: macOS (x64 + arm64)
            target: --mac
            artifact: dist/release/*.dmg
            artifact_name: aria-player-macos
          - os: ubuntu-latest
            label: Linux x64
            target: --linux
            artifact: |
              dist/release/*.AppImage
              dist/release/*.deb
            artifact_name: aria-player-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 部分依赖路径较长（qqmusic/node_modules），Windows 需开启长路径
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 验证关键构建依赖可用。
      #
      # 为什么单独验证：npm 11.x 引入了 allow-scripts 机制，install 脚本
      # 默认可能被跳过（日志里会出现 "packages have install scripts not yet
      # covered by allowScripts"）。esbuild 的二进制虽由 optionalDependencies
      # 的平台包提供、不依赖 postinstall，但若被跳过就会在 electron-vite
      # 构建阶段才报错 —— 那时已经浪费了几分钟 CI。这里提前失败，定位更快。
      - name: Verify build toolchain
        shell: bash
        run: |
          node -e "const {build}=require('esbuild');console.log('esbuild OK')" \
            || node -e "require('esbuild').transformSync('const a=1',{loader:'js'});console.log('esbuild OK')"
          node -e "console.log('electron:', require('electron/package.json').version)"
          node -e "console.log('electron-vite:', require('electron-vite/package.json').version)"

      # 应用图标（从 SVG 生成各尺寸 PNG）
      - name: Generate icon
        run: python scripts/gen-icon.py

      # ---- 运行时依赖：两个内置 API 服务 ----
      #
      # 注意两者的仓库状态不同：
      #   server/   —— 已入库（含 node_modules），脚本检测到 app.js 存在会**自动跳过**
      #                （除非加 --force）。这里仍跑一次是为了：
      #                1) 应用本地补丁（关闭 npm info 版本检查、惰性加载 jsdom 等
      #                   启动优化），补丁逻辑在脚本内，跳过 vendor 就不会执行
      #                2) 万一仓库里的是残缺状态，脚本能自愈
      #   qqmusic/  —— 被 .gitignore 排除（22000+ 文件不适合入库），
      #                CI 必须现场克隆 + npm install
      - name: Vendor api-enhanced (网易云)
        run: node scripts/vendor-server.mjs

      - name: Vendor qq-music-api (QQ 音乐)
        run: node scripts/vendor-qqmusic.mjs

      # 验证 QQ 音乐预编译产物已生成。
      #
      # vendor-qqmusic.mjs 末尾会自动跑 build-qqmusic.mjs（esbuild 预编译），
      # 但它失败时只 warn 不中断（bridge 会回退 ts-node 实时编译，仍能跑）。
      # 那样打包出来的版本「能用但首次用 QQ 音源要等 5 秒」—— 属于静默降级。
      # 这里显式检查，让 CI 明确失败而不是悄悄退化。
      - name: Verify qqmusic prebuilt bundle
        shell: bash
        run: |
          if [ ! -f qqmusic/dist/app.cjs ]; then
            echo "::error::qqmusic/dist/app.cjs 未生成，QQ 音乐将回退 ts-node 实时编译（启动慢 15 倍）"
            exit 1
          fi
          ls -la qqmusic/dist/app.cjs
          echo "预编译产物已就绪"

      # ---- ffmpeg（B 站 DASH 合流 / 转码兜底必需）----
      # 脚本按 process.platform 自动选对应平台的静态构建
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs

      # ---- 编译三进程 ----
      # 用 build-app.mjs 而非 electron-vite CLI：
      # 前者会清掉 ELECTRON_RUN_AS_NODE / NODE_OPTIONS，
      # 避免 CI 环境变量污染导致构建产物异常
      - name: Build (main / preload / renderer)
        run: node scripts/build-app.mjs

      # ---- 打包 ----
      #
      # 只在「需要产物」时执行（见 job 级 SHOULD_PACKAGE），普通 push 仅验证编译。
      #
      # 为什么这样分：完整打包三平台约 18 分钟 runner 时间（3 job × 6 min），
      # 而私有仓库免费额度是 2000 分钟/月 —— 若每次 push 都打包，
      # 约 110 次推送就烧完。日常改动只需知道「代码能否编译」。
      - name: Package
        if: env.SHOULD_PACKAGE == 'true'
        env:
          # electron-builder 在 CI 上从 GitHub 拉 electron 与工具链
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      # ---- 上传 artifact ----
      #
      # ⚠️ 保留期从 14 天缩短到 **3 天**（实测教训）。
      #
      # 完整三平台产物约 1 GB/次。之前每次发版因事件重叠会跑 3 次构建，
      # 加上 14 天保留期，累计 **51 个 artifact / 17.5 GB**，
      # 直接把 Actions 存储配额（私有仓库 500 MB 免费）吃爆。
      #
      # 3 天的理由：产物真正需要长期保存的地方是 **Release**（永久），
      # artifact 只是「构建过程中的临时下载点」。Release 已经挂了三平台包，
      # artifact 过期不影响发布。
      - name: Upload artifact
        if: env.SHOULD_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 3
          # 同名 artifact 覆盖而非新增（同一 tag 重跑时不堆积）
          overwrite: true

  # ---------------------------------------------------------------
  # 发布：把三平台产物挂到 Release
  #
  # 只监听 push(tag) 与 release 两个入口。
  # `create` 事件已从 on: 里移除（它会造成重复构建，见文件头说明）。
  #
  # 两者不会同时出现：
  #   - 命令行推 tag        → 只有 push
  #   - 网页建 Release      → 只有 release
  #   - 网页单独建 tag      → 实测会触发 push（用 git/refs API 验证过）
  # 所以不存在「两个 run 并发写同一个 Release」的竞态
  #（softprops/action-gh-release 的 upstream issue #705）。
  # ---------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 校验 tag 与 package.json 版本一致，避免产物文件名与 tag 对不上
      #（实测踩过：v0.2.1 的 tag 上构建出 0.2.4 的产物）
      #
      # 各入口下 github.ref 都是 refs/tags/vX.Y.Z，故逻辑通用。
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json version ($PKG) 不一致，产物文件名会对不上"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aria Player ${{ github.ref_name }}
          # draft: false → 直接发布（本仓库为私有仓库，仅协作者可见）
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows | `Aria Player-*-setup.exe` | 安装版（可选目录、创建快捷方式「咏叹调」） |
            | Windows | `Aria Player-*-portable.exe` | 免安装版，双击即用 |
            | macOS | `Aria Player-*.dmg` | 同时含 Intel(x64) 与 Apple Silicon(arm64) |
            | Linux | `*.AppImage` | 免安装，`chmod +x` 后双击运行 |
            | Linux | `*.deb` | Debian/Ubuntu 包管理安装 |

            ## 首次运行提示

            三个平台均**未签名**，系统可能拦截：

            - **Windows**：SmartScreen 警告 → 「更多信息」→「仍要运行」
            - **macOS**：右键 → 打开；或终端执行
              `xattr -dr com.apple.quarantine "/Applications/Aria Player.app"`
            - **Linux**：`chmod +x "Aria Player-*.AppImage"`

            ## 说明

            应用**内置**完整运行时依赖，无需自行安装任何东西：

            - 网易云 API 服务（api-enhanced）
            - QQ 音乐 API 服务（qq-music-api）
            - ffmpeg（B 站 DASH 合流 / 转码兜底）

            三个服务均通过 **Named Pipe / Unix Socket** 与主进程通信，
            不占用任何 TCP 端口。
